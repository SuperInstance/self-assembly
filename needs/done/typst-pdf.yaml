name: typst-pdf
desire: "Typeset a PDF from a markup file"
when: "typeset a PDF from markup"
source:
  type: tarball
  url: "https://github.com/typst/typst/releases/download/v0.15.1/typst-aarch64-unknown-linux-musl.tar.xz"
  pin: "v0.15.1"
  sha256: "5aa8d74a3d906e60ea12a66ac2f37f8eef1b14cbad7182a745e393a10c23dcee"
verify:
  second_source: "human:muse:2026-10-06:hash computed locally from the release asset; no published checksums file (404 on .sha256 URL); tag mutability not assumed — sha256 is the real pin"
driver:
  command: "typst compile"
  path_extra: "$PLUGIN_DIR/bin"
  passthrough_flags: ["--version", "--help"]
install_recipe: 'tar -xf "$ART" -C "$DEST" --strip-components=1'
probe:
  - args: "--version"
    expect_contains: "0.15.1"
    timeout_s: 15
tests:
  - name: "version reports"
    args: "--version"
    expect_contains: "typst 0.15.1"
  - name: "compiles a minimal doc"
    args: "cases/hello.typ cases/hello.pdf"
    expect_file: "cases/hello.pdf"
cases:
  - path: "hello.typ"
    content: |
      = Hello from the console
      This PDF was typeset by a plugin the agent grew itself.

registered_at: 2026-10-06T02:27:43Z
registered_by: assembler
